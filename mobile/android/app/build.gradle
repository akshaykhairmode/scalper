apply plugin: 'com.android.application'

android {
    namespace "com.scalper.terminal"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.scalper.terminal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def keystoreFile = System.getenv("RELEASE_STORE_FILE") ? file(System.getenv("RELEASE_STORE_FILE")) : (file("scalper-release.jks").exists() ? file("scalper-release.jks") : file("${System.getProperty('user.home')}/.android/debug.keystore"))
            storeFile keystoreFile
            storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: "scalperpassword"
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: (keystoreFile.name.contains("debug") ? "androiddebugkey" : "scalper")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: (keystoreFile.name.contains("debug") ? "android" : "scalperpassword")
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ""
            debuggable true
            if (file("${System.getProperty('user.home')}/.android/debug.keystore").exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    if (findProject(':capacitor-android') != null) {
        implementation project(':capacitor-android')
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

if (file('capacitor.build.gradle').exists()) {
    apply from: 'capacitor.build.gradle'
}
