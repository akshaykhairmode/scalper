name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: build · vet · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "web/package.json"

      - name: Install web dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Typecheck TypeScript
        working-directory: web
        run: npm run typecheck

      - name: Web unit tests
        working-directory: web
        run: npm test

      - name: Build web assets
        working-directory: web
        run: npm run build

      - name: Compress static assets
        run: go run ./scripts/compress_assets.go

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: ./scripts/check-coverage.sh coverage.out 55

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  cross-build:
    name: build · ${{ matrix.goos }} · ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compress static assets
        run: go run ./scripts/compress_assets.go

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./cmd/scalper

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: golangci-lint run

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest

      - name: Check deadcode
        run: |
          output=$(deadcode ./cmd/scalper)
          if [ -n "$output" ]; then
            echo "deadcode found:"
            echo "$output"
            exit 1
          fi

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

  validate-mobile:
    name: validate mobile bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "mobile/package.json"

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Verify asset bundle sync
        working-directory: mobile
        run: npm run bundle

  release-version:
    name: determine release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, cross-build, lint, vuln, validate-mobile]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag --merged "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | while IFS= read -r tag; do
            # Patch must allow multi-digit values such as v0.25.10.
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "$tag"
              break
            fi
          done)"

          if [[ -n "$latest" ]]; then
            commits="$(git rev-list "$latest..$GITHUB_SHA")"
            if [[ -z "$commits" ]]; then
              echo "No commits since $latest; skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version="$(git log -z --format=%B "$latest..$GITHUB_SHA" | bash ./scripts/next-version.sh "$latest")"
          else
            version="$(git log -z --format=%B "$GITHUB_SHA" | bash ./scripts/next-version.sh)"
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            if [[ "$(git rev-list -n 1 "refs/tags/$version")" == "$GITHUB_SHA" ]]; then
              echo "Tag $version already points at $GITHUB_SHA; skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A tag can exist for a different commit when the version base was
            # mis-detected or a tag was created manually. Never skip silently:
            # bump to the next free patch so the release still ships.
            echo "Tag $version exists for another commit; bumping to the next free patch."
            while git rev-parse -q --verify "refs/tags/$version" >/dev/null; do
              version="$(printf 'fix: bump\n' | bash ./scripts/next-version.sh "$version")"
            done
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Next release: $version"

  release:
    name: publish semantic version release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-version.outputs.skip != 'true'
    needs: release-version
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-version.outputs.version }}

  mobile-release:
    name: publish mobile release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-version.outputs.skip != 'true'
    needs: [release-version, release]
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-release.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
      build_type: "release"

  deploy:
    name: deploy to server
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && needs.test.result == 'success' && needs.cross-build.result == 'success' && needs.lint.result == 'success' && needs.vuln.result == 'success'
    needs: [test, cross-build, lint, vuln, release-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Deployment Configuration
        id: config-check
        run: |
          TARGET_HOST="${{ secrets.SERVER_HOST || secrets.SERVER_IP }}"
          TARGET_KEY="${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}"

          # If neither is set, handle gracefully on push vs explicitly on manual trigger
          if [ -z "$TARGET_HOST" ] && [ -z "$TARGET_KEY" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error title=Missing Secrets::Neither SERVER_HOST nor SSH_PRIVATE_KEY secret is configured. Please configure them in Settings -> Secrets and variables -> Actions."
              exit 1
            fi
            echo "::notice title=Deployment Skipped::Neither SERVER_HOST nor SSH_PRIVATE_KEY secret is configured. Add them to Settings -> Secrets and variables -> Actions to enable automated server deployment."
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$TARGET_HOST" ]; then
            echo "::error title=Missing SERVER_HOST::SERVER_HOST secret is not configured in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "$TARGET_KEY" ]; then
            echo "::error title=Missing SSH_PRIVATE_KEY::SSH_PRIVATE_KEY secret is not configured in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Pre-flight credential checks
          if [ -z "${{ secrets.KOTAK_CONSUMER_KEY }}" ]; then
            echo "::warning title=Kotak Key Missing::KOTAK_CONSUMER_KEY secret is not set. Kotak login and live trading will be disabled on the remote server."
          fi
          if [ -z "${{ secrets.KOTAK_MOBILE_NUMBER || secrets.KOTAK_MOBILE }}" ]; then
            echo "::warning title=Kotak Mobile Missing::KOTAK_MOBILE_NUMBER secret is not set; server will rely on config.yaml."
          fi
          if [ -z "${{ secrets.KOTAK_UCC }}" ]; then
            echo "::warning title=Kotak UCC Missing::KOTAK_UCC secret is not set; server will rely on config.yaml."
          fi

          AUTH_USER="${{ secrets.SERVE_AUTH_USERNAME || vars.SERVE_AUTH_USERNAME || '' }}"
          AUTH_PASS="${{ secrets.SERVE_AUTH_PASSWORD || '' }}"
          if [ -z "$AUTH_USER" ] || [ -z "$AUTH_PASS" ]; then
            echo "::error title=Missing Auth Configuration::Both SERVE_AUTH_USERNAME and SERVE_AUTH_PASSWORD must be configured in Settings -> Secrets and variables -> Actions to protect the deployed terminal."
            exit 1
          fi

          echo "can_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Remote Server
        if: steps.config-check.outputs.can_deploy == 'true'
        env:
          APP_VERSION: ${{ needs.release-version.outputs.version }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER || 'opc' }}
          SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '' }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME || 'scalper' }}
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN || vars.SERVER_DOMAIN || '' }}
          KOTAK_CONSUMER_KEY: ${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_MPIN: ${{ secrets.KOTAK_MPIN }}
          KOTAK_MOBILE_NUMBER: ${{ secrets.KOTAK_MOBILE_NUMBER || secrets.KOTAK_MOBILE }}
          KOTAK_UCC: ${{ secrets.KOTAK_UCC }}
          KOTAK_NEO_FIN_KEY: ${{ secrets.KOTAK_NEO_FIN_KEY || vars.KOTAK_NEO_FIN_KEY || 'neotradeapi' }}
          SERVE_AUTH_USERNAME: ${{ secrets.SERVE_AUTH_USERNAME || vars.SERVE_AUTH_USERNAME || 'trader' }}
          SERVE_AUTH_PASSWORD: ${{ secrets.SERVE_AUTH_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_AGENT_API_KEY: ${{ secrets.AI_AGENT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_ENABLED: ${{ vars.AI_ENABLED || secrets.AI_ENABLED || '' }}
          AI_SHADOW_MODE: ${{ vars.AI_SHADOW_MODE || secrets.AI_SHADOW_MODE || '' }}
          AI_AGENT_PROVIDER: ${{ vars.AI_AGENT_PROVIDER || secrets.AI_AGENT_PROVIDER || '' }}
          AI_AGENT_MODEL: ${{ vars.AI_AGENT_MODEL || secrets.AI_AGENT_MODEL || '' }}
          AI_JEV_MODEL: ${{ vars.AI_JEV_MODEL || secrets.AI_JEV_MODEL || '' }}
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh
