name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: Semantic version tag to publish (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Compress static assets
        run: go run ./scripts/compress_assets.go

      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: ./scripts/check-coverage.sh coverage.out 55

  build:
    name: package · ${{ matrix.goos }} · ${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compress static assets
        run: go run ./scripts/compress_assets.go

      - name: Build and package
        id: package
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          stage="stage"
          binary="scalper"
          if [ "$GOOS" = "windows" ]; then
            binary="scalper.exe"
          fi
          mkdir -p "$stage"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags "-s -w -X github.com/akshaykhairmode/scalper/internal/version.Version=${RELEASE_VERSION} -X github.com/akshaykhairmode/scalper/internal/version.Commit=${RELEASE_COMMIT} -X github.com/akshaykhairmode/scalper/internal/version.BuildDate=${build_date}" \
            -o "$stage/$binary" ./cmd/scalper
          cp config.example.yaml LICENSE "$stage/"
          cp docs/HSM_PROTOCOL.md "$stage/"
          archive="scalper_${RELEASE_VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd "$stage" && zip -q "../${archive}.zip" "$binary" config.example.yaml LICENSE HSM_PROTOCOL.md)
            echo "archive=${archive}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${archive}.tar.gz" -C "$stage" .
            echo "archive=${archive}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
