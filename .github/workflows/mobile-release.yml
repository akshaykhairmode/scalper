name: Mobile Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to attach binaries to (optional, e.g. v1.0.0)"
        required: false
        type: string
      build_type:
        description: "Android build type (release or debug)"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      server_url:
        description: "Scalper backend URL to embed in mobile bundle"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        type: string
      build_type:
        description: "Android build type"
        required: false
        default: "release"
        type: string
      server_url:
        description: "Backend URL"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "mobile/package.json"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor mobile dependencies
        working-directory: mobile
        run: |
          npm ci || npm install

      - name: Sync web assets & configure server URL
        working-directory: mobile
        env:
          INPUT_SERVER_URL: ${{ inputs.server_url }}
        run: |
          if [ -n "$INPUT_SERVER_URL" ]; then
            echo "Configuring custom server URL: $INPUT_SERVER_URL"
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
              cfg.server = cfg.server || {};
              cfg.server.url = process.env.INPUT_SERVER_URL;
              fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
            "
          fi
          npm run bundle
          npx cap sync android

      - name: Setup Android signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding production release keystore from secrets..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > mobile/android/app/scalper-release.jks
            echo "RELEASE_STORE_FILE=scalper-release.jks" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "Generating dedicated Scalper release signing keystore..."
            keytool -genkeypair -v -keystore mobile/android/app/scalper-release.jks \
              -alias scalper \
              -keypass scalperpassword \
              -storepass scalperpassword \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Scalper Terminal,OU=Trading,O=Scalper,L=Mumbai,ST=Maharashtra,C=IN"
            echo "RELEASE_STORE_FILE=scalper-release.jks" >> $GITHUB_ENV
            echo "RELEASE_STORE_PASSWORD=scalperpassword" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=scalper" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=scalperpassword" >> $GITHUB_ENV
          fi

      - name: Build Android APK with Gradle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          build_type="${{ inputs.build_type || 'release' }}"
          if [ "$build_type" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Package APK artifact
        run: |
          set -euo pipefail
          apk_file="$(find mobile/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk_file" ]; then
            echo "ERROR: No APK binary was produced by Gradle build."
            exit 1
          fi
          echo "Found compiled APK: $apk_file"
          cp "$apk_file" scalper-android.apk
          sha256sum scalper-android.apk > scalper-android.apk.sha256
          echo "APK SHA-256:"
          cat scalper-android.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scalper-android.apk
          path: |
            scalper-android.apk
            scalper-android.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Determine release tag
        id: release-info
        run: |
          target_tag="${{ inputs.version || inputs.release_tag }}"
          if [ -z "$target_tag" ] && [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            target_tag="${{ github.ref_name }}"
          fi
          echo "tag=$target_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$target_tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach APK to GitHub Release
        if: steps.release-info.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          files: |
            scalper-android.apk
            scalper-android.apk.sha256

  build-ios:
    name: validate iOS build
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "mobile/package.json"

      - name: Install Capacitor mobile dependencies
        working-directory: mobile
        run: |
          npm ci || npm install

      - name: Sync web assets & install CocoaPods
        working-directory: mobile
        run: |
          npm run bundle
          npx cap sync ios
          cd ios/App
          pod install --repo-update || pod install

      - name: Validate Xcode project build
        working-directory: mobile/ios/App
        run: |
          echo "Listing available schemes and configurations:"
          xcodebuild -workspace App.xcworkspace -list || xcodebuild -list || true

          # Ensure capacitor.config.json and public exist in all relative paths expected by Xcode
          if [ -f "App/capacitor.config.json" ]; then
            cp -f App/capacitor.config.json capacitor.config.json 2>/dev/null || true
            mkdir -p App/App
            cp -f App/capacitor.config.json App/App/capacitor.config.json 2>/dev/null || true
          fi
          if [ -d "App/public" ]; then
            cp -Rf App/public public 2>/dev/null || true
            mkdir -p App/App
            cp -Rf App/public App/App/public 2>/dev/null || true
          fi

          build_cmd="xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CODE_SIGN_STYLE=Manual COMPILER_INDEX_STORE_ENABLE=NO build"
          if [ ! -d "App.xcworkspace" ]; then
            build_cmd="xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CODE_SIGN_STYLE=Manual COMPILER_INDEX_STORE_ENABLE=NO build"
          fi

          echo "Executing: $build_cmd"
          if ! eval "$build_cmd" > xcodebuild.log 2>&1; then
            echo "::error::Xcode build failed. Showing last 120 lines of build log:"
            tail -n 120 xcodebuild.log
            echo "::error::Filtered compiler errors:"
            grep -i -E '(error:|fatal error:)' xcodebuild.log || true
            exit 1
          fi
          echo "iOS build validation succeeded!"

      - name: Package iOS binaries
        run: |
          set -euo pipefail
          app_path="$(find mobile/ios/App/DerivedData/Build/Products -type d -name 'App.app' 2>/dev/null | head -n 1)"
          if [ -z "$app_path" ]; then
            app_path="$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'App.app' 2>/dev/null | head -n 1)"
          fi
          if [ -z "$app_path" ]; then
            echo "::error::Could not find compiled App.app bundle"
            exit 1
          fi
          echo "Found compiled iOS app: $app_path"

          # 1. Simulator zip (ready to drag-and-drop into iOS Simulator)
          (cd "$(dirname "$app_path")" && zip -r -q "$GITHUB_WORKSPACE/scalper-ios-simulator.zip" "App.app")

          # 2. Unsigned .ipa package (standard Payload/ structure for sideloading / AltStore / TrollStore)
          mkdir -p /tmp/payload_pack/Payload
          cp -Rf "$app_path" /tmp/payload_pack/Payload/App.app
          (cd /tmp/payload_pack && zip -r -q "$GITHUB_WORKSPACE/scalper-ios-unsigned.ipa" Payload)
          rm -rf /tmp/payload_pack

          sha256sum scalper-ios-simulator.zip > scalper-ios-simulator.zip.sha256
          sha256sum scalper-ios-unsigned.ipa > scalper-ios-unsigned.ipa.sha256
          echo "iOS binaries packaged:"
          ls -lh scalper-ios*

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scalper-ios
          path: |
            scalper-ios-simulator.zip
            scalper-ios-simulator.zip.sha256
            scalper-ios-unsigned.ipa
            scalper-ios-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Determine release tag
        id: release-info
        run: |
          target_tag="${{ inputs.version || inputs.release_tag }}"
          if [ -z "$target_tag" ] && [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            target_tag="${{ github.ref_name }}"
          fi
          echo "tag=$target_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$target_tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach iOS binaries to GitHub Release
        if: steps.release-info.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-info.outputs.tag }}
          files: |
            scalper-ios-simulator.zip
            scalper-ios-simulator.zip.sha256
            scalper-ios-unsigned.ipa
            scalper-ios-unsigned.ipa.sha256
